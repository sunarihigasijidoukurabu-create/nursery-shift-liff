<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>職員シフト管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .line-green { background-color: #06C755; }
    .line-green-hover:hover { background-color: #05b34c; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans pb-10">

  <header class="line-green text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <i class="fa-brands fa-line text-2xl"></i>
      <h1 class="font-bold text-base">シフト管理 LIFF</h1>
    </div>
    <span id="user-name" class="text-xs bg-white text-gray-800 px-3 py-1 rounded-full font-semibold shadow">認証中...</span>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- ローディング表示 -->
    <div id="loading" class="text-center py-12 space-y-3">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-green-500 border-t-transparent"></div>
      <p id="loading-msg" class="text-xs text-gray-500 font-bold">LINE認証処理中...</p>
    </div>

    <!-- 初回新規登録画面 -->
    <div id="sec-register" class="bg-white p-5 rounded-xl shadow-sm space-y-4 hidden">
      <div class="text-center space-y-1">
        <i class="fa-solid fa-user-plus text-3xl text-green-500"></i>
        <h2 class="font-bold text-base text-gray-800">新規アカウント登録</h2>
        <p class="text-xs text-gray-500">お名前と区分を入力して利用を開始してください。</p>
      </div>
      
      <div class="space-y-3 pt-2">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">お名前（氏名）</label>
          <input type="text" id="input-staff-name" placeholder="例: 山田 太郎" class="w-full p-2.5 border rounded-lg bg-gray-50 text-sm focus:ring-2 focus:ring-green-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">雇用区分</label>
          <select id="select-job-type" class="w-full p-2.5 border rounded-lg bg-gray-50 text-sm focus:ring-2 focus:ring-green-500">
            <option value="パート">パート・アルバイト</option>
            <option value="正社員">正社員</option>
          </select>
        </div>
        
        <button onclick="createNewProfile()" class="w-full line-green line-green-hover text-white py-3 rounded-lg font-bold text-sm shadow">
          登録して利用を開始する
        </button>
      </div>
    </div>

    <!-- アプリメイン画面 -->
    <div id="app-content" class="space-y-4 hidden">

      <div class="bg-white rounded-xl shadow-sm p-1 flex text-xs font-bold text-gray-600">
        <button id="btn-tab-sub" onclick="switchTab('sub')" class="flex-1 py-2 rounded-lg bg-green-500 text-white">希望シフト提出</button>
        <button id="btn-tab-view" onclick="switchTab('view')" class="flex-1 py-2 rounded-lg hover:text-green-600">確定シフト確認</button>
      </div>

      <!-- ① 希望シフト提出画面 -->
      <div id="sec-sub" class="bg-white p-4 rounded-xl shadow-sm space-y-4">
        <div class="border-b pb-2 flex justify-between items-center">
          <h2 class="font-bold text-sm text-gray-700"><i class="fa-solid fa-clock text-green-500 mr-1"></i> 希望勤務時間の入力</h2>
          <span class="text-[10px] text-gray-400">直近4日分</span>
        </div>

        <div id="shift-input-list" class="space-y-3 text-xs"></div>

        <button onclick="submitRequests()" class="w-full line-green line-green-hover text-white py-3 rounded-lg font-bold text-sm shadow">
          <i class="fa-solid fa-paper-plane mr-1"></i> 希望シフトを送信する
        </button>
      </div>

      <!-- ② 確定シフト確認画面 -->
      <div id="sec-view" class="bg-white p-4 rounded-xl shadow-sm space-y-3 hidden">
        <h2 class="font-bold text-sm text-gray-700 border-b pb-2"><i class="fa-solid fa-calendar-check text-blue-500 mr-1"></i> あなたの確定シフト</h2>
        <div id="confirmed-list" class="space-y-2 text-xs"></div>
      </div>

    </div>

  </main>

  <script>
    const LIFF_ID = "201212177-rbcBxEHH";
    // ★Step 1で取得したGASのWeb API URLを貼り付けます
    const GAS_API_URL = "https://script.google.com/macros/s/ここに取得したAPIのURLを貼り付け/exec"; 
    
    let userId = "";

    window.onload = function() {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
          } else {
            liff.getProfile().then(profile => {
              userId = profile.userId;
              checkUserProfile();
            }).catch(err => alert("プロフィール取得エラー: " + err));
          }
        })
        .catch(err => alert("LIFF初期化エラー: " + err));
    };

    function postToGas(payload) {
      return fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(res => res.json());
    }

    function checkUserProfile() {
      document.getElementById('loading-msg').innerText = "スプレッドシートデータ取得中...";
      
      postToGas({ action: 'checkProfile', userId: userId })
        .then(res => {
          document.getElementById('loading').classList.add('hidden');
          if (res.isRegistered) {
            document.getElementById('user-name').innerText = res.data.name + " さん";
            document.getElementById('app-content').classList.remove('hidden');
            renderInputForm();
            loadConfirmedShifts();
          } else {
            document.getElementById('user-name').innerText = "新規ユーザー";
            document.getElementById('sec-register').classList.remove('hidden');
          }
        })
        .catch(err => {
          document.getElementById('loading-msg').innerText = "通信エラー発生";
          alert("【GAS通信エラー】\n" + err.message);
        });
    }

    function createNewProfile() {
      const name = document.getElementById('input-staff-name').value.trim();
      const jobType = document.getElementById('select-job-type').value;

      if (!name) {
        alert("お名前を入力してください。");
        return;
      }

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('sec-register').classList.add('hidden');

      postToGas({ action: 'registerStaff', userId: userId, name: name, jobType: jobType })
        .then(res => {
          if (res.success) {
            alert("登録が完了しました！");
            checkUserProfile();
          } else {
            alert("登録エラー: " + res.message);
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('sec-register').classList.remove('hidden');
          }
        });
    }

    const targetDates = ['2026-11-01', '2026-11-02', '2026-11-04', '2026-11-05'];
    function renderInputForm() {
      const container = document.getElementById('shift-input-list');
      container.innerHTML = '';

      targetDates.forEach(date => {
        const div = document.createElement('div');
        div.className = "p-3 border rounded-lg bg-gray-50 space-y-2";
        div.innerHTML = `
          <div class="font-bold text-gray-700">${date}</div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-gray-500">区分</label>
              <select id="type-${date}" class="w-full p-1.5 border rounded bg-white" onchange="toggleTimeInput('${date}')">
                <option value="出勤希望">出勤可能</option>
                <option value="休み希望">休み希望</option>
              </select>
            </div>
            <div id="time-box-${date}" class="flex items-center space-x-1">
              <input type="time" id="start-${date}" value="08:30" class="w-full p-1 border rounded bg-white">
              <span>〜</span>
              <input type="time" id="end-${date}" value="17:30" class="w-full p-1 border rounded bg-white">
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function toggleTimeInput(date) {
      const type = document.getElementById(`type-${date}`).value;
      const box = document.getElementById(`time-box-${date}`);
      if (type === '休み希望') {
        box.classList.add('opacity-30', 'pointer-events-none');
      } else {
        box.classList.remove('opacity-30', 'pointer-events-none');
      }
    }

    function submitRequests() {
      let requests = [];
      targetDates.forEach(date => {
        const type = document.getElementById(`type-${date}`).value;
        const startTime = document.getElementById(`start-${date}`).value;
        const endTime = document.getElementById(`end-${date}`).value;

        requests.push({
          date: date,
          type: type,
          startTime: type === '出勤希望' ? startTime : '',
          endTime: type === '出勤希望' ? endTime : ''
        });
      });

      postToGas({ action: 'saveRequests', userId: userId, requests: requests })
        .then(res => {
          alert('希望シフトを送信しました！');
        });
    }

    function loadConfirmedShifts() {
      postToGas({ action: 'getConfirmed', userId: userId })
        .then(res => {
          const list = document.getElementById('confirmed-list');
          list.innerHTML = '';
          if (res.success && res.data.length > 0) {
            res.data.forEach(s => {
              const item = document.createElement('div');
              item.className = "flex justify-between p-2 bg-green-50 border border-green-200 rounded font-semibold text-green-900";
              item.innerHTML = `<span>${s.date}</span><span>${s.startTime} 〜 ${s.endTime}</span>`;
              list.appendChild(item);
            });
          } else {
            list.innerHTML = '<p class="text-center text-gray-400 py-4">確定シフトはありません。</p>';
          }
        });
    }

    function switchTab(tab) {
      if (tab === 'sub') {
        document.getElementById('sec-sub').classList.remove('hidden');
        document.getElementById('sec-view').classList.add('hidden');
        document.getElementById('btn-tab-sub').className = "flex-1 py-2 rounded-lg bg-green-500 text-white font-bold";
        document.getElementById('btn-tab-view').className = "flex-1 py-2 rounded-lg text-gray-600 font-bold";
      } else {
        document.getElementById('sec-sub').classList.add('hidden');
        document.getElementById('sec-view').classList.remove('hidden');
        document.getElementById('btn-tab-sub').className = "flex-1 py-2 rounded-lg text-gray-600 font-bold";
        document.getElementById('btn-tab-view').className = "flex-1 py-2 rounded-lg bg-green-500 text-white font-bold";
      }
    }
  </script>
</body>
</html>
