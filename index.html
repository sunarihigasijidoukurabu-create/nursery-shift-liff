<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>園シフト管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .line-green { background-color: #06C755; }
    .line-green-hover:hover { background-color: #05b34c; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans pb-10">

  <header class="line-green text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <i class="fa-brands fa-line text-2xl"></i>
      <h1 class="font-bold text-base">シフト管理 LIFF</h1>
    </div>
    <div class="text-right">
      <span id="user-name" class="text-xs bg-white text-gray-800 px-3 py-1 rounded-full font-semibold shadow block">認証中...</span>
      <span id="user-role" class="text-[10px] text-green-100 font-bold hidden"></span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- ローディング表示 -->
    <div id="loading" class="text-center py-12 space-y-3">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-green-500 border-t-transparent"></div>
      <p id="loading-msg" class="text-xs text-gray-500 font-bold">通信処理中...</p>
    </div>

    <!-- 初回新規登録画面 -->
    <div id="sec-register" class="bg-white p-5 rounded-xl shadow-sm space-y-4 hidden">
      <div class="text-center space-y-1">
        <i class="fa-solid fa-user-plus text-3xl text-green-500"></i>
        <h2 class="font-bold text-base text-gray-800">新規アカウント登録</h2>
        <p class="text-xs text-gray-500">お名前と区分を入力して利用を開始してください。</p>
      </div>
      <div class="space-y-3 pt-2">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">お名前（氏名）</label>
          <input type="text" id="input-staff-name" placeholder="例: 山田 太郎" class="w-full p-2.5 border rounded-lg bg-gray-50 text-sm focus:ring-2 focus:ring-green-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">雇用区分</label>
          <select id="select-job-type" class="w-full p-2.5 border rounded-lg bg-gray-50 text-sm focus:ring-2 focus:ring-green-500">
            <option value="パート">パート・アルバイト</option>
            <option value="正社員">正社員</option>
          </select>
        </div>
        <button onclick="createNewProfile()" class="w-full line-green line-green-hover text-white py-3 rounded-lg font-bold text-sm shadow">
          登録して利用を開始する
        </button>
      </div>
    </div>

    <!-- アプリメイン画面 -->
    <div id="app-content" class="space-y-4 hidden">

      <!-- 対象月選択 -->
      <div class="bg-white p-3 rounded-xl shadow-sm flex justify-between items-center">
        <label class="text-xs font-bold text-gray-600">対象年月:</label>
        <input type="month" id="target-month" class="p-1.5 border rounded-lg text-sm font-bold text-gray-700 bg-gray-50" onchange="onMonthChange()">
      </div>

      <!-- タブ切り替え -->
      <div class="bg-white rounded-xl shadow-sm p-1 flex text-xs font-bold text-gray-600">
        <button id="btn-tab-sub" onclick="switchTab('sub')" class="flex-1 py-2 rounded-lg bg-green-500 text-white">希望提出</button>
        <button id="btn-tab-view" onclick="switchTab('view')" class="flex-1 py-2 rounded-lg hover:text-green-600">確定確認</button>
        <button id="btn-tab-admin" onclick="switchTab('admin')" class="flex-1 py-2 rounded-lg hover:text-red-600 hidden text-red-600">★管理者機能</button>
      </div>

      <!-- ① 1ヶ月希望シフト提出画面 -->
      <div id="sec-sub" class="bg-white p-4 rounded-xl shadow-sm space-y-4">
        
        <div class="bg-green-50 border border-green-200 rounded-lg p-3 text-xs space-y-2">
          <div class="font-bold text-green-800 flex justify-between items-center">
            <span><i class="fa-solid fa-bolt mr-1"></i> 希望シフトの一括入力</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-gray-600">区分</label>
              <select id="bulk-type" class="w-full p-1 border rounded bg-white text-[11px]">
                <option value="出勤希望">出勤可能</option>
                <option value="休み希望">休み希望</option>
              </select>
            </div>
            <div class="flex items-center space-x-1">
              <input type="time" id="bulk-start" value="08:30" class="w-full p-1 border rounded bg-white text-[11px]">
              <span>-</span>
              <input type="time" id="bulk-end" value="17:30" class="w-full p-1 border rounded bg-white text-[11px]">
            </div>
          </div>
          <button onclick="applyBulkInput()" class="w-full bg-green-600 text-white py-1.5 rounded font-bold text-[11px] shadow hover:bg-green-700">
            平日（月〜土）すべてに上記を一括反映
          </button>
        </div>

        <div class="border-b pb-2 flex justify-between items-center">
          <h2 class="font-bold text-sm text-gray-700"><i class="fa-solid fa-calendar-days text-green-500 mr-1"></i> 希望勤務日・時間</h2>
          <span class="text-[10px] text-gray-400">1ヶ月分一括設定</span>
        </div>

        <div id="shift-input-list" class="space-y-2 text-xs max-h-[50vh] overflow-y-auto pr-1"></div>

        <button onclick="submitRequests()" class="w-full line-green line-green-hover text-white py-3 rounded-lg font-bold text-sm shadow">
          <i class="fa-solid fa-paper-plane mr-1"></i> 1ヶ月分の希望を送信する
        </button>
      </div>

      <!-- ② 確定シフト確認画面 -->
      <div id="sec-view" class="bg-white p-4 rounded-xl shadow-sm space-y-3 hidden">
        <h2 class="font-bold text-sm text-gray-700 border-b pb-2"><i class="fa-solid fa-calendar-check text-blue-500 mr-1"></i> あなたの確定シフト</h2>
        <div id="confirmed-list" class="space-y-2 text-xs max-h-[60vh] overflow-y-auto"></div>
      </div>

      <!-- ③ 管理者専用画面 -->
      <div id="sec-admin" class="space-y-4 hidden">

        <!-- 1. 自動作成・手動調整 -->
        <div class="bg-white p-4 rounded-xl shadow-sm space-y-3 border-2 border-red-200">
          <h2 class="font-bold text-sm text-red-600 border-b pb-2"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> シフト生成・手動調整</h2>
          <p class="text-xs text-gray-600">
            選択月（<span id="admin-target-month-label" class="font-bold"></span>）の希望データから作成します。
          </p>
          <button onclick="runAutoShiftGeneration()" class="w-full bg-red-500 hover:bg-red-600 text-white py-2.5 rounded-lg font-bold text-xs shadow">
            選択月のシフトを自動作成・再生成する
          </button>

          <div class="border-t pt-3 space-y-2">
            <h3 class="font-bold text-xs text-gray-700">【確定シフトの手動微調整】</h3>
            <div id="admin-shift-edit-list" class="space-y-2 text-xs max-h-[35vh] overflow-y-auto pr-1"></div>
            <button onclick="saveAdminShiftEdits()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-bold text-xs shadow">
              変更したシフト内容を保存する
            </button>
          </div>
        </div>

        <!-- 2. 必要人員・開所時間設定（行事日・変形設定対応） -->
        <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <div>
              <h2 class="font-bold text-sm text-gray-700"><i class="fa-solid fa-clock-rotate-left mr-1 text-orange-500"></i> 必要人員設定（変形・行事対応）</h2>
              <p class="text-[10px] text-gray-400">日付指定なし＝平日共通 / 日付指定あり＝特定行事日優先</p>
            </div>
            <button onclick="addRequirementRow()" class="text-xs bg-gray-200 px-2 py-1 rounded font-bold">+ 行追加</button>
          </div>
          <div id="admin-req-list" class="space-y-2 text-xs"></div>
          <button onclick="saveRequirements()" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-2 rounded font-bold text-xs shadow">
            必要人員設定を保存する
          </button>
        </div>

        <!-- 3. 職員ステータス管理 -->
        <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
          <h2 class="font-bold text-sm text-gray-700 border-b pb-2"><i class="fa-solid fa-users-gear mr-1 text-blue-500"></i> 職員マスタ管理</h2>
          <div id="admin-staff-list" class="space-y-2 text-xs max-h-[30vh] overflow-y-auto"></div>
        </div>

      </div>

    </div>

  </main>

  <script>
    const LIFF_ID = "2012121277-rbcBxEHH";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyPcR-HFwaArgWAZi_ABCv3xqnQ9N3fxySIVX8CoRXtagttyT1YGPZhHgX6uxx--dN5Mw/exec"; 
    
    let userId = "";
    let userRole = "一般";
    let currentMonthDays = [];
    let currentAdminShifts = [];

    window.onload = function() {
      const today = new Date();
      today.setMonth(today.getMonth() + 1);
      document.getElementById('target-month').value = today.toISOString().slice(0, 7);

      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
          } else {
            liff.getProfile().then(profile => {
              userId = profile.userId;
              checkUserProfile();
            }).catch(err => alert("プロフィール取得エラー: " + err));
          }
        })
        .catch(err => alert("LIFF初期化エラー: " + err));
    };

    function postToGas(payload) {
      return fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(res => res.json());
    }

    function checkUserProfile() {
      document.getElementById('loading-msg').innerText = "ユーザー情報確認中...";
      
      postToGas({ action: 'checkProfile', userId: userId })
        .then(res => {
          document.getElementById('loading').classList.add('hidden');
          if (res.isBlocked) {
            alert(res.message);
            document.getElementById('loading-msg').innerText = "利用停止中";
            return;
          }

          if (res.isRegistered) {
            userRole = res.data.role;
            document.getElementById('user-name').innerText = res.data.name + " さん";
            
            if (userRole === '管理者') {
              const roleTag = document.getElementById('user-role');
              roleTag.innerText = "【管理者】";
              roleTag.classList.remove('hidden');
              document.getElementById('btn-tab-admin').classList.remove('hidden');
              loadAdminData();
            }

            document.getElementById('app-content').classList.remove('hidden');
            onMonthChange();
          } else {
            document.getElementById('user-name').innerText = "新規ユーザー";
            document.getElementById('sec-register').classList.remove('hidden');
          }
        });
    }

    function createNewProfile() {
      const name = document.getElementById('input-staff-name').value.trim();
      const jobType = document.getElementById('select-job-type').value;

      if (!name) { alert("お名前を入力してください。"); return; }

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('sec-register').classList.add('hidden');

      postToGas({ action: 'registerStaff', userId: userId, name: name, jobType: jobType })
        .then(res => {
          if (res.success) {
            alert("登録が完了しました！");
            checkUserProfile();
          }
        });
    }

    function onMonthChange() {
      const yearMonth = document.getElementById('target-month').value;
      document.getElementById('admin-target-month-label').innerText = yearMonth;
      generateMonthCalendar(yearMonth);
      loadConfirmedShifts();
      if (userRole === '管理者') loadAdminShiftEdits();
    }

    function generateMonthCalendar(yearMonth) {
      const [year, month] = yearMonth.split('-').map(Number);
      const daysInMonth = new Date(year, month, 0).getDate();
      currentMonthDays = [];

      const container = document.getElementById('shift-input-list');
      container.innerHTML = '';
      const weekNames = ['日', '月', '火', '水', '木', '金', '土'];

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dateObj = new Date(year, month - 1, day);
        const dayOfWeek = weekNames[dateObj.getDay()];
        const isSunday = dateObj.getDay() === 0;

        currentMonthDays.push(dateStr);

        const div = document.createElement('div');
        div.className = `p-2 border rounded-lg flex items-center justify-between text-xs ${isSunday ? 'bg-red-50 border-red-200' : 'bg-gray-50'}`;
        div.innerHTML = `
          <div class="font-bold ${isSunday ? 'text-red-600' : 'text-gray-700'} w-20">
            ${month}/${day} (${dayOfWeek})
          </div>
          <div class="flex items-center space-x-1 flex-1">
            <select id="type-${dateStr}" class="p-1 border rounded bg-white text-[11px]" onchange="toggleTimeInput('${dateStr}')">
              <option value="出勤希望">出勤可能</option>
              <option value="休み希望" ${isSunday ? 'selected' : ''}>休み希望</option>
            </select>
            <div id="time-box-${dateStr}" class="flex items-center space-x-0.5 ${isSunday ? 'opacity-30 pointer-events-none' : ''}">
              <input type="time" id="start-${dateStr}" value="08:30" class="p-1 border rounded bg-white text-[11px]">
              <span>-</span>
              <input type="time" id="end-${dateStr}" value="17:30" class="p-1 border rounded bg-white text-[11px]">
            </div>
            ${day > 1 ? `<button onclick="copyPreviousDay('${dateStr}',${day})" class="text-gray-400 hover:text-green-600 px-1"><i class="fa-solid fa-copy"></i></button>` : ''}
          </div>
        `;
        container.appendChild(div);
      }
    }

    function copyPreviousDay(currentDateStr, dayNumber) {
      const yearMonth = document.getElementById('target-month').value;
      const [year, month] = yearMonth.split('-').map(Number);
      const prevDateStr = `${year}-${String(month).padStart(2, '0')}-${String(dayNumber - 1).padStart(2, '0')}`;

      const prevType = document.getElementById(`type-${prevDateStr}`).value;
      const prevStart = document.getElementById(`start-${prevDateStr}`).value;
      const prevEnd = document.getElementById(`end-${prevDateStr}`).value;

      document.getElementById(`type-${currentDateStr}`).value = prevType;
      document.getElementById(`start-${currentDateStr}`).value = prevStart;
      document.getElementById(`end-${currentDateStr}`).value = prevEnd;
      toggleTimeInput(currentDateStr);
    }

    function applyBulkInput() {
      const type = document.getElementById('bulk-type').value;
      const start = document.getElementById('bulk-start').value;
      const end = document.getElementById('bulk-end').value;

      currentMonthDays.forEach(dateStr => {
        const dateObj = new Date(dateStr);
        if (dateObj.getDay() !== 0) {
          document.getElementById(`type-${dateStr}`).value = type;
          document.getElementById(`start-${dateStr}`).value = start;
          document.getElementById(`end-${dateStr}`).value = end;
          toggleTimeInput(dateStr);
        }
      });
      alert('日曜日以外の全日に一括適用しました！');
    }

    function toggleTimeInput(dateStr) {
      const type = document.getElementById(`type-${dateStr}`).value;
      const box = document.getElementById(`time-box-${dateStr}`);
      if (type === '休み希望') {
        box.classList.add('opacity-30', 'pointer-events-none');
      } else {
        box.classList.remove('opacity-30', 'pointer-events-none');
      }
    }

    function submitRequests() {
      const yearMonth = document.getElementById('target-month').value;
      let requests = [];

      currentMonthDays.forEach(dateStr => {
        const type = document.getElementById(`type-${dateStr}`).value;
        const startTime = document.getElementById(`start-${dateStr}`).value;
        const endTime = document.getElementById(`end-${dateStr}`).value;

        requests.push({
          date: dateStr,
          type: type,
          startTime: type === '出勤希望' ? startTime : '',
          endTime: type === '出勤希望' ? endTime : ''
        });
      });

      document.getElementById('loading').classList.remove('hidden');

      postToGas({ action: 'saveRequests', userId: userId, yearMonth: yearMonth, requests: requests })
        .then(res => {
          document.getElementById('loading').classList.add('hidden');
          if (res.success) alert(`${yearMonth} 分の希望シフトを送信しました！`);
        });
    }

    function loadConfirmedShifts() {
      const yearMonth = document.getElementById('target-month').value;
      postToGas({ action: 'getConfirmed', userId: userId, yearMonth: yearMonth })
        .then(res => {
          const list = document.getElementById('confirmed-list');
          list.innerHTML = '';
          const myShifts = res.data ? res.data.filter(s => String(s.userId) === String(userId)) : [];

          if (res.success && myShifts.length > 0) {
            myShifts.forEach(s => {
              const item = document.createElement('div');
              item.className = "flex justify-between p-2.5 bg-green-50 border border-green-200 rounded font-semibold text-green-900";
              item.innerHTML = `<span>${s.date}</span><span>${s.startTime} 〜 ${s.endTime}</span>`;
              list.appendChild(item);
            });
          } else {
            list.innerHTML = `<p class="text-center text-gray-400 py-6">${yearMonth} の確定シフトはまだありません。</p>`;
          }
        });
    }

    function loadAdminData() {
      // 職員一覧取得
      postToGas({ action: 'getStaffList', userId: userId }).then(res => {
        if (res.success) {
          const container = document.getElementById('admin-staff-list');
          container.innerHTML = '';
          res.data.forEach(s => {
            const div = document.createElement('div');
            div.className = "p-2 border rounded bg-gray-50 flex items-center justify-between text-xs";
            div.innerHTML = `
              <div>
                <div class="font-bold text-gray-800">${s['職員氏名']}</div>
                <div class="text-[10px] text-gray-400">${s['権限']}</div>
              </div>
              <div class="flex items-center space-x-1">
                <select id="staff-job-${s['LINEユーザーID']}" class="p-1 border rounded bg-white text-[10px]">
                  <option value="パート" ${s['雇用区分'] === 'パート' ? 'selected' : ''}>パート</option>
                  <option value="正社員" ${s['雇用区分'] === '正社員' ? 'selected' : ''}>正社員</option>
                </select>
                <select id="staff-status-${s['LINEユーザーID']}" class="p-1 border rounded bg-white text-[10px]">
                  <option value="有効" ${s['ステータス'] === '有効' ? 'selected' : ''}>有効</option>
                  <option value="休職" ${s['ステータス'] === '休職' ? 'selected' : ''}>休職</option>
                  <option value="退職" ${s['ステータス'] === '退職' ? 'selected' : ''}>退職</option>
                </select>
                <button onclick="updateStaffStatus('${s['LINEユーザーID']}')" class="bg-blue-600 text-white px-2 py-1 rounded text-[10px] font-bold">更新</button>
              </div>
            `;
            container.appendChild(div);
          });
        }
      });

      // 必要人員取得（行事日対応）
      postToGas({ action: 'getRequirements', userId: userId }).then(res => {
        if (res.success) {
          const container = document.getElementById('admin-req-list');
          container.innerHTML = '';
          if (res.data.length === 0) {
            addRequirementRow();
          } else {
            res.data.forEach(r => addRequirementRow(r['対象日'], r['開始時間'], r['終了時間'], r['必要人数']));
          }
        }
      });

      loadAdminShiftEdits();
    }

    // 管理者手動修正用一覧読み込み
    function loadAdminShiftEdits() {
      const yearMonth = document.getElementById('target-month').value;
      postToGas({ action: 'getConfirmed', userId: userId, yearMonth: yearMonth }).then(res => {
        if (res.success) {
          currentAdminShifts = res.data || [];
          const container = document.getElementById('admin-shift-edit-list');
          container.innerHTML = '';

          if (currentAdminShifts.length === 0) {
            container.innerHTML = '<p class="text-gray-400 text-center py-2">シフトデータがありません。「自動作成」を押してください。</p>';
            return;
          }

          currentAdminShifts.forEach((s, idx) => {
            const div = document.createElement('div');
            div.className = "p-2 border rounded bg-gray-50 flex items-center justify-between text-[11px]";
            div.innerHTML = `
              <div>
                <span class="font-bold text-gray-700">${s.date}</span>
                <span class="ml-1 text-gray-600">(${s.staffName})</span>
              </div>
              <div class="flex items-center space-x-1">
                <input type="time" id="edit-start-${idx}" value="${s.startTime}" class="p-0.5 border rounded">
                <span>-</span>
                <input type="time" id="edit-end-${idx}" value="${s.endTime}" class="p-0.5 border rounded">
                <button onclick="removeShiftRow(${idx})" class="text-red-500 font-bold px-1">×</button>
              </div>
            `;
            container.appendChild(div);
          });
        }
      });
    }

    function removeShiftRow(idx) {
      currentAdminShifts.splice(idx, 1);
      loadAdminShiftEdits();
    }

    function saveAdminShiftEdits() {
      const yearMonth = document.getElementById('target-month').value;
      currentAdminShifts.forEach((s, idx) => {
        const startEl = document.getElementById(`edit-start-${idx}`);
        const endEl = document.getElementById(`edit-end-${idx}`);
        if (startEl && endEl) {
          s.startTime = startEl.value;
          s.endTime = endEl.value;
        }
      });

      postToGas({ action: 'saveConfirmedShifts', userId: userId, yearMonth: yearMonth, shifts: currentAdminShifts })
        .then(res => {
          if (res.success) alert('手動修正したシフトを保存しました！');
        });
    }

    function updateStaffStatus(targetUserId) {
      const status = document.getElementById(`staff-status-${targetUserId}`).value;
      const jobType = document.getElementById(`staff-job-${targetUserId}`).value;

      postToGas({ action: 'updateStaffStatus', userId: userId, targetUserId: targetUserId, status: status, jobType: jobType })
        .then(res => {
          if (res.success) alert('職員情報を更新しました。');
        });
    }

    // 必要人員行追加（特定日指定対応）
    function addRequirementRow(date = "", start = "08:30", end = "17:30", count = 2) {
      const container = document.getElementById('admin-req-list');
      const div = document.createElement('div');
      div.className = "flex items-center space-x-1 req-row border-b pb-1";
      div.innerHTML = `
        <input type="date" value="${date}" class="req-date p-1 border rounded text-[10px] w-24" title="空欄で平日共通">
        <input type="time" value="${start}" class="req-start p-1 border rounded text-[10px]">
        <span>-</span>
        <input type="time" value="${end}" class="req-end p-1 border rounded text-[10px]">
        <input type="number" value="${count}" min="1" class="req-count w-10 p-1 border rounded text-[10px] text-center">
        <span>人</span>
        <button onclick="this.parentElement.remove()" class="text-red-500 font-bold px-1 text-xs">×</button>
      `;
      container.appendChild(div);
    }

    function saveRequirements() {
      const rows = document.querySelectorAll('.req-row');
      let requirements = [];
      rows.forEach(r => {
        requirements.push({
          date: r.querySelector('.req-date').value,
          startTime: r.querySelector('.req-start').value,
          endTime: r.querySelector('.req-end').value,
          count: r.querySelector('.req-count').value
        });
      });

      postToGas({ action: 'saveRequirements', userId: userId, requirements: requirements })
        .then(res => {
          if (res.success) alert('必要人員設定（行事日指定含む）を保存しました！');
        });
    }

    function runAutoShiftGeneration() {
      const yearMonth = document.getElementById('target-month').value;
      if (!confirm(`${yearMonth} 分の自動シフト生成を実行しますか？（既存の同月データは上書きされます）`)) return;

      document.getElementById('loading').classList.remove('hidden');

      postToGas({ action: 'generateAutoShift', userId: userId, yearMonth: yearMonth })
        .then(res => {
          document.getElementById('loading').classList.add('hidden');
          if (res.success) {
            alert(`自動作成が完了しました！（${res.count}件のシフトを出力）`);
            loadConfirmedShifts();
            loadAdminShiftEdits();
          } else {
            alert(`生成エラー: ${res.message}`);
          }
        });
    }

    function switchTab(tab) {
      document.getElementById('sec-sub').classList.add('hidden');
      document.getElementById('sec-view').classList.add('hidden');
      document.getElementById('sec-admin').classList.add('hidden');

      document.getElementById('btn-tab-sub').className = "flex-1 py-2 rounded-lg hover:text-green-600";
      document.getElementById('btn-tab-view').className = "flex-1 py-2 rounded-lg hover:text-green-600";
      document.getElementById('btn-tab-admin').className = "flex-1 py-2 rounded-lg text-red-600 hover:text-red-700";

      if (tab === 'sub') {
        document.getElementById('sec-sub').classList.remove('hidden');
        document.getElementById('btn-tab-sub').className = "flex-1 py-2 rounded-lg bg-green-500 text-white font-bold";
      } else if (tab === 'view') {
        document.getElementById('sec-view').classList.remove('hidden');
        document.getElementById('btn-tab-view').className = "flex-1 py-2 rounded-lg bg-green-500 text-white font-bold";
      } else if (tab === 'admin') {
        document.getElementById('sec-admin').classList.remove('hidden');
        document.getElementById('btn-tab-admin').className = "flex-1 py-2 rounded-lg bg-red-500 text-white font-bold";
      }
    }
  </script>
</body>
</html>
