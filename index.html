<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>園シフト管理 LIFF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .line-green { background-color: #06C755; }
    .line-green-hover:hover { background-color: #05b34c; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

  <!-- ヘッダー -->
  <header class="line-green text-white px-4 py-3 shadow-md sticky top-0 z-40 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-shapes text-xl"></i>
      <h1 class="font-bold text-sm tracking-wide">園シフト管理</h1>
    </div>
    <div class="flex items-center space-x-2">
      <span id="user-role-badge" class="hidden text-[10px] bg-red-600 px-2 py-0.5 rounded-full font-bold">管理者</span>
      <span id="user-name" class="text-xs bg-white text-slate-800 px-2.5 py-1 rounded-full font-semibold shadow-sm">認証中...</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-3 space-y-3">

    <!-- ローディング -->
    <div id="loading" class="text-center py-12 space-y-3">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-green-500 border-t-transparent"></div>
      <p id="loading-msg" class="text-xs text-slate-500 font-bold">データを読み込み中...</p>
    </div>

    <!-- 初回新規登録 -->
    <div id="sec-register" class="bg-white p-5 rounded-2xl shadow-sm space-y-4 hidden border border-slate-200">
      <div class="text-center space-y-1">
        <i class="fa-solid fa-user-plus text-3xl text-green-500"></i>
        <h2 class="font-bold text-base text-slate-800">職員アカウント初期登録</h2>
        <p class="text-xs text-slate-500">氏名と区分を登録して利用を開始してください。</p>
      </div>
      <div class="space-y-3 pt-2">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">職員氏名</label>
          <input type="text" id="input-staff-name" placeholder="例: 山田 太郎" class="w-full p-2.5 border rounded-xl bg-slate-50 text-sm focus:ring-2 focus:ring-green-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">雇用区分</label>
          <select id="select-job-type" class="w-full p-2.5 border rounded-xl bg-slate-50 text-sm focus:ring-2 focus:ring-green-500">
            <option value="パート">パート・アルバイト</option>
            <option value="正社員">正社員</option>
          </select>
        </div>
        <button onclick="createNewProfile()" class="w-full line-green line-green-hover text-white py-3 rounded-xl font-bold text-sm shadow">
          登録を完了する
        </button>
      </div>
    </div>

    <!-- アプリメイン画面 -->
    <div id="app-content" class="space-y-3 hidden">

      <!-- 年月選択バー -->
      <div class="bg-white p-2.5 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
        <span class="text-xs font-bold text-slate-600 flex items-center">
          <i class="fa-regular fa-calendar-days mr-1.5 text-green-600"></i>対象年月:
        </span>
        <input type="month" id="target-month" class="px-2.5 py-1 border rounded-lg text-sm font-bold text-slate-700 bg-slate-50" onchange="onMonthChange()">
      </div>

      <!-- ナビゲーションタブ -->
      <div class="bg-slate-200/80 p-1 rounded-xl flex text-xs font-bold text-slate-600">
        <button id="btn-tab-sub" onclick="switchTab('sub')" class="flex-1 py-2 rounded-lg bg-white text-slate-800 shadow-sm transition-all">希望提出</button>
        <button id="btn-tab-view" onclick="switchTab('view')" class="flex-1 py-2 rounded-lg hover:text-green-600 transition-all">確定シフト</button>
        <button id="btn-tab-admin" onclick="switchTab('admin')" class="flex-1 py-2 rounded-lg hover:text-red-600 transition-all hidden text-red-600">★管理者</button>
      </div>

      <!-- ① 希望シフト提出画面 -->
      <div id="sec-sub" class="space-y-3">
        <div class="bg-white border border-green-200 rounded-2xl p-3.5 shadow-sm space-y-2.5">
          <div class="text-xs font-bold text-green-800 flex items-center justify-between">
            <span><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>平日一括反映ツール</span>
            <span class="text-[10px] text-green-600 font-normal">月〜金に適用</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <select id="bulk-type" class="p-1.5 border rounded-lg bg-slate-50 text-xs font-semibold">
              <option value="出勤希望">出勤可能</option>
              <option value="休み希望">休み希望</option>
            </select>
            <div class="flex items-center space-x-1">
              <input type="time" id="bulk-start" value="08:30" class="w-full p-1 border rounded bg-slate-50 text-xs text-center">
              <span class="text-slate-400">-</span>
              <input type="time" id="bulk-end" value="17:30" class="w-full p-1 border rounded bg-slate-50 text-xs text-center">
            </div>
          </div>
          <button onclick="applyBulkInput()" class="w-full bg-green-600 hover:bg-green-700 text-white py-1.5 rounded-lg font-bold text-xs shadow-sm">
            平日（月〜金）に一括反映
          </button>
        </div>

        <div id="shift-input-list" class="space-y-2 text-xs max-h-[52vh] overflow-y-auto pr-0.5"></div>

        <button onclick="submitRequests()" class="w-full line-green line-green-hover text-white py-3 rounded-xl font-bold text-sm shadow">
          この内容で希望を送信する
        </button>
      </div>

      <!-- ② 確定シフト確認画面 -->
      <div id="sec-view" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3 hidden">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="font-bold text-xs text-slate-700"><i class="fa-solid fa-calendar-check text-blue-500 mr-1.5"></i>シフト確認</h2>
          <div class="space-x-1 text-xs font-bold">
            <button id="btn-view-list" onclick="switchViewMode('list')" class="px-2.5 py-1 bg-blue-600 text-white rounded-lg shadow-sm">自分のシフト</button>
            <button id="btn-view-cal" onclick="switchViewMode('calendar')" class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg">園全体</button>
          </div>
        </div>

        <div id="view-mode-list" class="space-y-2 text-xs max-h-[58vh] overflow-y-auto"></div>

        <div id="view-mode-calendar" class="hidden space-y-3">
          <div class="grid grid-cols-7 gap-1 text-center font-bold text-[10px] text-slate-400 bg-slate-50 p-1.5 rounded-lg">
            <span class="text-red-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-blue-500">土</span>
          </div>
          <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-xs"></div>
          <div id="calendar-day-detail" class="p-3 bg-blue-50/70 border border-blue-200 rounded-xl text-xs hidden space-y-1.5"></div>
        </div>
      </div>

      <!-- ③ 管理者画面 -->
      <div id="sec-admin" class="space-y-4 hidden">

        <!-- シフト自動生成 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-red-200 space-y-3">
          <div class="flex justify-between items-center">
            <h2 class="font-bold text-xs text-red-600 flex items-center">
              <i class="fa-solid fa-microchip mr-1.5"></i>シフト自動作成 & 最適化
            </h2>
            <button onclick="runAutoShiftGeneration()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg font-bold text-xs shadow-sm">
              <i class="fa-solid fa-play mr-1"></i>自動生成実行
            </button>
          </div>

          <div id="admin-shortage-alert-box" class="hidden border border-amber-300 bg-amber-50 rounded-xl p-3 space-y-2 text-xs">
            <div class="font-bold text-amber-800 flex items-center">
              <i class="fa-solid fa-triangle-exclamation mr-1.5 text-amber-600"></i>不足箇所の診断レポート
            </div>
            <p class="text-[11px] text-amber-700">条件を満たせない時間帯です。仮シフトとして保存済みですので、下部で手修正してください。</p>
            <div id="shortage-alert-list" class="space-y-1.5 max-h-36 overflow-y-auto pr-1"></div>
          </div>
        </div>

        <!-- 確定シフト手動調整 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <div>
              <h2 class="font-bold text-xs text-slate-800">日別シフト手修正</h2>
              <p class="text-[10px] text-slate-400">日付ごとの配置人数確認・時間の微修正</p>
            </div>
            <button onclick="saveAdminShiftEdits()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg font-bold text-xs shadow-sm">
              変更を保存
            </button>
          </div>
          <div id="admin-daily-shift-container" class="space-y-2 text-xs max-h-[50vh] overflow-y-auto pr-1"></div>
        </div>

        <!-- 必要人員設定（カレンダー選択対応） -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <div>
              <h2 class="font-bold text-xs text-slate-800">必要人員・時間帯設定</h2>
              <p class="text-[10px] text-slate-400">平日共通（月〜金）または日付指定で設定</p>
            </div>
            <button onclick="addRequirementRow()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded font-bold border">+ 追加</button>
          </div>
          <div id="admin-req-list" class="space-y-2 text-xs"></div>
          <button onclick="saveRequirements()" class="w-full bg-slate-700 hover:bg-slate-800 text-white py-2 rounded-xl font-bold text-xs shadow-sm">設定を保存</button>
        </div>

        <!-- 職員マスタ管理（上限日数・時間の個別編集対応） -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <div class="border-b pb-2">
            <h2 class="font-bold text-xs text-slate-800">職員マスタ管理</h2>
            <p class="text-[10px] text-slate-400">区分・ステータス・週上限日数や時間の個別設定</p>
          </div>
          <div id="admin-staff-list" class="space-y-3 text-xs max-h-[45vh] overflow-y-auto pr-1"></div>
        </div>

      </div>

    </div>
  </main>

  <script>
    const LIFF_ID = "2012121277-rbcBxEHH";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyPcR-HFwaArgWAZi_ABCv3xqnQ9N3fxySIVX8CoRXtagttyT1YGPZhHgX6uxx--dN5Mw/exec"; 
    
    let userId = "";
    let userRole = "一般";
    let currentMonthDays = [];
    let currentConfirmedShifts = [];
    let masterStaffList = [];
    let masterRequirements = [];

    window.onload = function() {
      const today = new Date();
      today.setMonth(today.getMonth() + 1);
      document.getElementById('target-month').value = today.toISOString().slice(0, 7);

      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
          } else {
            liff.getProfile().then(profile => {
              userId = profile.userId;
              checkUserProfile();
            }).catch(err => alert("プロフィール取得失敗: " + err));
          }
        })
        .catch(err => alert("LIFF初期化エラー: " + err));
    };

    function postToGas(payload) {
      return fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(res => res.json());
    }

    function checkUserProfile() {
      postToGas({ action: 'checkProfile', userId: userId }).then(res => {
        document.getElementById('loading').classList.add('hidden');
        if (res.isBlocked) {
          alert(res.message);
          return;
        }
        if (res.isRegistered) {
          userRole = res.data.role;
          document.getElementById('user-name').innerText = res.data.name + " さん";
          if (userRole === '管理者') {
            document.getElementById('user-role-badge').classList.remove('hidden');
            document.getElementById('btn-tab-admin').classList.remove('hidden');
          }
          document.getElementById('app-content').classList.remove('hidden');
          onMonthChange();
        } else {
          document.getElementById('sec-register').classList.remove('hidden');
        }
      });
    }

    function createNewProfile() {
      const name = document.getElementById('input-staff-name').value.trim();
      const jobType = document.getElementById('select-job-type').value;
      if (!name) { alert("お名前を入力してください。"); return; }
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('sec-register').classList.add('hidden');
      postToGas({ action: 'registerStaff', userId: userId, name: name, jobType: jobType }).then(res => {
        if (res.success) checkUserProfile();
      });
    }

    function onMonthChange() {
      const yearMonth = document.getElementById('target-month').value;
      generateMonthCalendar(yearMonth);
      loadConfirmedShifts();
      if (userRole === '管理者') loadAdminData();
    }

    function generateMonthCalendar(yearMonth) {
      const [year, month] = yearMonth.split('-').map(Number);
      const daysInMonth = new Date(year, month, 0).getDate();
      currentMonthDays = [];
      const container = document.getElementById('shift-input-list');
      container.innerHTML = '<div class="text-center py-4 text-slate-400">カレンダー生成中...</div>';
      const weekNames = ['日', '月', '火', '水', '木', '金', '土'];

      postToGas({ action: 'getRequests', userId: userId, yearMonth: yearMonth }).then(res => {
        container.innerHTML = '';
        const savedRequests = (res && res.success) ? res.data : [];

        for (let day = 1; day <= daysInMonth; day++) {
          const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const dateObj = new Date(year, month - 1, day);
          const dayOfWeek = weekNames[dateObj.getDay()];
          const isSunday = dateObj.getDay() === 0;
          const isSaturday = dateObj.getDay() === 6;
          currentMonthDays.push(dateStr);

          const saved = savedRequests.find(r => r.date === dateStr);
          let defaultType = saved ? saved.type : (isSunday ? '休み希望' : '出勤希望');
          let defaultStart = saved && saved.startTime ? saved.startTime : '08:30';
          let defaultEnd = saved && saved.endTime ? saved.endTime : '17:30';

          const div = document.createElement('div');
          div.className = `p-2.5 border rounded-xl flex items-center justify-between text-xs transition-all ${isSunday ? 'bg-red-50/70 border-red-100' : isSaturday ? 'bg-blue-50/70 border-blue-100' : 'bg-white border-slate-200'}`;
          div.innerHTML = `
            <div class="font-bold ${isSunday ? 'text-red-600' : isSaturday ? 'text-blue-600' : 'text-slate-700'} w-20">
              ${month}/${day} (${dayOfWeek})
            </div>
            <div class="flex items-center space-x-1.5 flex-1 justify-end">
              <select id="type-${dateStr}" class="p-1 border rounded-lg bg-slate-50 text-[11px] font-semibold" onchange="toggleTimeInput('${dateStr}')">
                <option value="出勤希望" ${defaultType === '出勤希望' ? 'selected' : ''}>出勤可能</option>
                <option value="休み希望" ${defaultType === '休み希望' ? 'selected' : ''}>休み希望</option>
              </select>
              // 日別カレンダーのHTML生成部
<div id="time-box-${dateStr}" class="flex items-center space-x-0.5 ${defaultType === '休み希望' ? 'opacity-30 pointer-events-none' : ''}">
  <input type="time" id="start-${dateStr}" value="${defaultStart}" placeholder="終日" class="p-1 border rounded bg-slate-50 text-[11px]">
  <span class="text-slate-400">-</span>
  <input type="time" id="end-${dateStr}" value="${defaultEnd}" placeholder="終日" class="p-1 border rounded bg-slate-50 text-[11px]">
  <button type="button" onclick="document.getElementById('start-${dateStr}').value='';document.getElementById('end-${dateStr}').value='';" title="時間をクリアして終日可能にする" class="text-slate-400 hover:text-slate-600 px-1 text-[10px]">
    終日
  </button>
</div>
              ${day > 1 ? `<button onclick="copyPreviousDay('${dateStr}', ${day})" title="前日の設定をコピー" class="text-slate-400 hover:text-green-600 px-1"><i class="fa-solid fa-copy"></i></button>` : ''}
            </div>
          `;
          container.appendChild(div);
        }
      });
    }

    function copyPreviousDay(currentDateStr, dayNumber) {
      const yearMonth = document.getElementById('target-month').value;
      const [year, month] = yearMonth.split('-').map(Number);
      const prevDateStr = `${year}-${String(month).padStart(2, '0')}-${String(dayNumber - 1).padStart(2, '0')}`;
      document.getElementById(`type-${currentDateStr}`).value = document.getElementById(`type-${prevDateStr}`).value;
      document.getElementById(`start-${currentDateStr}`).value = document.getElementById(`start-${prevDateStr}`).value;
      document.getElementById(`end-${currentDateStr}`).value = document.getElementById(`end-${prevDateStr}`).value;
      toggleTimeInput(currentDateStr);
    }

    // 月〜金（平日のみ）に一括反映
    function applyBulkInput() {
      const type = document.getElementById('bulk-type').value;
      const start = document.getElementById('bulk-start').value;
      const end = document.getElementById('bulk-end').value;
      currentMonthDays.forEach(dateStr => {
        const day = new Date(dateStr).getDay();
        if (day >= 1 && day <= 5) { // 月〜金のみ
          document.getElementById(`type-${dateStr}`).value = type;
          document.getElementById(`start-${dateStr}`).value = start;
          document.getElementById(`end-${dateStr}`).value = end;
          toggleTimeInput(dateStr);
        }
      });
      alert('月〜金曜日に一括反映しました。');
    }

    function toggleTimeInput(dateStr) {
      const type = document.getElementById(`type-${dateStr}`).value;
      const box = document.getElementById(`time-box-${dateStr}`);
      if (type === '休み希望') box.classList.add('opacity-30', 'pointer-events-none');
      else box.classList.remove('opacity-30', 'pointer-events-none');
    }

    function submitRequests() {
      const yearMonth = document.getElementById('target-month').value;
      let requests = [];
      currentMonthDays.forEach(dateStr => {
        const type = document.getElementById(`type-${dateStr}`).value;
        requests.push({
          date: dateStr,
          type: type,
          startTime: type === '出勤希望' ? document.getElementById(`start-${dateStr}`).value : '',
          endTime: type === '出勤希望' ? document.getElementById(`end-${dateStr}`).value : ''
        });
      });
      document.getElementById('loading').classList.remove('hidden');
      postToGas({ action: 'saveRequests', userId: userId, yearMonth: yearMonth, requests: requests }).then(res => {
        document.getElementById('loading').classList.add('hidden');
        if (res.success) alert('希望シフトを送信しました！');
      });
    }

    function loadConfirmedShifts() {
      const yearMonth = document.getElementById('target-month').value;
      postToGas({ action: 'getConfirmed', userId: userId, yearMonth: yearMonth }).then(res => {
        if (res.success) {
          currentConfirmedShifts = res.data || [];
          renderListView();
          renderCalendarView();
          if (userRole === '管理者') renderAdminDailyEdits();
        }
      });
    }

    function renderListView() {
      const list = document.getElementById('view-mode-list');
      list.innerHTML = '';
      const myShifts = currentConfirmedShifts.filter(s => String(s.userId) === String(userId));

      if (myShifts.length > 0) {
        myShifts.forEach(s => {
          const item = document.createElement('div');
          item.className = "flex justify-between items-center p-3 bg-green-50 border border-green-200 rounded-xl text-green-900";
          item.innerHTML = `
            <span class="font-bold"><i class="fa-regular fa-calendar-check mr-2 text-green-600"></i>${s.date}</span>
            <span class="bg-white px-2.5 py-1 rounded-lg border border-green-200 font-semibold text-xs">${s.startTime} 〜 ${s.endTime}</span>
          `;
          list.appendChild(item);
        });
      } else {
        list.innerHTML = `<div class="text-center text-slate-400 py-8"><i class="fa-regular fa-calendar-xmark text-2xl mb-1 block"></i>確定シフトはまだありません。</div>`;
      }
    }

    function renderCalendarView() {
      const yearMonth = document.getElementById('target-month').value;
      const [year, month] = yearMonth.split('-').map(Number);
      const firstDayIndex = new Date(year, month - 1, 1).getDay();
      const daysInMonth = new Date(year, month, 0).getDate();
      
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = "h-14 bg-slate-50/50 rounded-lg";
        grid.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayShifts = currentConfirmedShifts.filter(s => s.date === dateStr);
        const dayOfWeek = new Date(year, month - 1, day).getDay();

        const cell = document.createElement('div');
        cell.className = `h-14 p-1 border rounded-xl flex flex-col justify-between cursor-pointer transition-all ${dayShifts.length > 0 ? 'bg-green-50 border-green-300 font-bold hover:bg-green-100' : 'bg-white border-slate-200'}`;
        cell.onclick = () => showDayDetail(dateStr, dayShifts);
        cell.innerHTML = `
          <div class="text-[10px] ${dayOfWeek === 0 ? 'text-red-500' : dayOfWeek === 6 ? 'text-blue-500' : 'text-slate-700'}">${day}</div>
          ${dayShifts.length > 0 ? `<div class="text-[9px] text-center bg-green-600 text-white rounded-md py-0.5">${dayShifts.length}名</div>` : '<div class="text-[9px] text-slate-300 text-center">-</div>'}
        `;
        grid.appendChild(cell);
      }
    }

    function showDayDetail(dateStr, shifts) {
      const detailBox = document.getElementById('calendar-day-detail');
      detailBox.classList.remove('hidden');
      if (shifts.length === 0) {
        detailBox.innerHTML = `<div class="font-bold text-slate-700">${dateStr}</div><p class="text-slate-400">出勤予定者はいません。</p>`;
        return;
      }
      let html = `<div class="font-bold text-blue-900 border-b border-blue-200 pb-1 mb-1 flex justify-between"><span>${dateStr} の出勤予定</span><span class="text-blue-600 font-bold">${shifts.length}名</span></div><div class="space-y-1">`;
      shifts.forEach(s => {
        html += `
          <div class="flex justify-between items-center text-slate-700 bg-white/70 p-1.5 rounded-lg border border-blue-100">
            <span class="font-semibold">${s.staffName} <span class="text-[9px] text-slate-400">(${s.jobType})</span></span>
            <span class="font-mono text-blue-800 text-[11px]">${s.startTime}〜${s.endTime}</span>
          </div>`;
      });
      html += `</div>`;
      detailBox.innerHTML = html;
    }

    function switchViewMode(mode) {
      const listEl = document.getElementById('view-mode-list');
      const calEl = document.getElementById('view-mode-calendar');
      const btnList = document.getElementById('btn-view-list');
      const btnCal = document.getElementById('btn-view-cal');

      if (mode === 'list') {
        listEl.classList.remove('hidden');
        calEl.classList.add('hidden');
        btnList.className = "px-2.5 py-1 bg-blue-600 text-white rounded-lg shadow-sm";
        btnCal.className = "px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg";
      } else {
        listEl.classList.add('hidden');
        calEl.classList.remove('hidden');
        btnCal.className = "px-2.5 py-1 bg-blue-600 text-white rounded-lg shadow-sm";
        btnList.className = "px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg";
      }
    }

    // ③ 管理者用機能
    function loadAdminData() {
      postToGas({ action: 'getStaffList', userId: userId }).then(res => {
        if (res.success) {
          masterStaffList = res.data;
          renderAdminStaffList();
        }
      });

      postToGas({ action: 'getRequirements', userId: userId }).then(res => {
        if (res.success) {
          masterRequirements = res.data;
          renderAdminRequirements();
        }
      });
    }

    // 職員マスタ管理：上限日数・時間の編集に対応
    function renderAdminStaffList() {
      const container = document.getElementById('admin-staff-list');
      container.innerHTML = '';
      masterStaffList.forEach(s => {
        const uid = s['LINEユーザーID'];
        const div = document.createElement('div');
        div.className = "p-3 border rounded-2xl bg-white border-slate-200 shadow-sm space-y-2.5";
        div.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-100 pb-1.5">
            <span class="font-bold text-slate-800 text-sm">${s['職員氏名']}</span>
            <span class="text-[10px] text-slate-400 font-mono bg-slate-50 px-2 py-0.5 rounded">${s['権限']}</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] text-slate-500 font-bold block mb-0.5">雇用区分</label>
              <select id="staff-job-${uid}" class="w-full p-1.5 border rounded-lg bg-slate-50 text-xs">
                <option value="パート" ${s['雇用区分'] === 'パート' ? 'selected' : ''}>パート</option>
                <option value="正社員" ${s['雇用区分'] === '正社員' ? 'selected' : ''}>正社員</option>
              </select>
            </div>
            <div>
              <label class="text-[10px] text-slate-500 font-bold block mb-0.5">ステータス</label>
              <select id="staff-status-${uid}" class="w-full p-1.5 border rounded-lg bg-slate-50 text-xs font-semibold">
                <option value="有効" ${s['ステータス'] === '有効' ? 'selected' : ''}>有効</option>
                <option value="休職" ${s['ステータス'] === '休職' ? 'selected' : ''}>休職</option>
                <option value="退職" ${s['ステータス'] === '退職' ? 'selected' : ''}>退職</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2 bg-slate-50 p-2 rounded-xl border border-slate-100">
            <div>
              <label class="text-[9px] text-slate-500 font-bold block">週上限日数</label>
              <div class="flex items-center space-x-1 mt-0.5">
                <input type="number" id="staff-days-${uid}" value="${s['週上限日数'] ?? (s['雇用区分'] === '正社員' ? 5 : 3)}" min="1" max="7" class="w-full p-1 border rounded bg-white text-xs text-center font-bold">
                <span class="text-[10px] text-slate-400">日</span>
              </div>
            </div>
            <div>
              <label class="text-[9px] text-slate-500 font-bold block">1日上限時間</label>
              <div class="flex items-center space-x-1 mt-0.5">
                <input type="number" id="staff-hours-${uid}" value="${s['1日上限時間'] ?? (s['雇用区分'] === '正社員' ? 8 : 6)}" min="1" max="24" step="0.5" class="w-full p-1 border rounded bg-white text-xs text-center font-bold">
                <span class="text-[10px] text-slate-400">h</span>
              </div>
            </div>
            <div>
              <label class="text-[9px] text-slate-500 font-bold block">週上限時間</label>
              <div class="flex items-center space-x-1 mt-0.5">
                <input type="number" id="staff-whours-${uid}" value="${s['週上限時間'] ?? (s['雇用区分'] === '正社員' ? 40 : 20)}" min="1" max="168" step="0.5" class="w-full p-1 border rounded bg-white text-xs text-center font-bold">
                <span class="text-[10px] text-slate-400">h</span>
              </div>
            </div>
          </div>
          <button onclick="updateStaff('${uid}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-1.5 rounded-lg text-xs font-bold shadow-sm">
            この職員の設定を保存
          </button>
        `;
        container.appendChild(div);
      });
    }

    function updateStaff(targetUserId) {
      const status = document.getElementById(`staff-status-${targetUserId}`).value;
      const jobType = document.getElementById(`staff-job-${targetUserId}`).value;
      const maxDays = document.getElementById(`staff-days-${targetUserId}`).value;
      const maxHours = document.getElementById(`staff-hours-${targetUserId}`).value;
      const maxWeeklyHours = document.getElementById(`staff-whours-${targetUserId}`).value;

      postToGas({
        action: 'updateStaffStatus',
        userId: userId,
        targetUserId: targetUserId,
        status: status,
        jobType: jobType,
        maxDays: maxDays,
        maxHours: maxHours,
        maxWeeklyHours: maxWeeklyHours
      }).then(res => {
        if (res.success) alert('職員情報を更新しました。');
        else alert('更新失敗: ' + res.message);
      });
    }

    // 必要人員設定の描画
    function renderAdminRequirements() {
      const container = document.getElementById('admin-req-list');
      container.innerHTML = '';
      if (masterRequirements.length === 0) {
        addRequirementRow();
      } else {
        masterRequirements.forEach(r => addRequirementRow(r['対象日'], r['開始時間'], r['終了時間'], r['必要人数']));
      }
    }

    // カレンダー選択対応の行追加
    function addRequirementRow(date = "平日共通", start = "08:30", end = "17:30", count = 2) {
      const container = document.getElementById('admin-req-list');
      const isCommon = !date || String(date).includes('平日共通');
      const formattedDate = isCommon ? '' : String(date).substring(0, 10);
      const rowId = 'req-' + Math.random().toString(36).substr(2, 9);

      const div = document.createElement('div');
      div.id = rowId;
      div.className = "p-2.5 bg-slate-50 border border-slate-200 rounded-xl space-y-2 req-row text-xs";
      div.innerHTML = `
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-1.5">
            <select class="req-type p-1 border rounded bg-white text-[11px] font-bold" onchange="toggleReqDateInput('${rowId}')">
              <option value="平日共通" ${isCommon ? 'selected' : ''}>平日共通 (月〜金)</option>
              <option value="特定日" ${!isCommon ? 'selected' : ''}>日付指定 (カレンダー)</option>
            </select>
            <input type="date" value="${formattedDate}" class="req-date p-1 border rounded bg-white text-[11px] font-mono ${isCommon ? 'hidden' : ''}">
          </div>
          <button onclick="this.closest('.req-row').remove()" class="text-red-500 hover:text-red-700 font-bold px-2 py-0.5 text-xs"><i class="fa-solid fa-trash-can"></i></button>
        </div>
        <div class="flex items-center space-x-2 justify-between">
          <div class="flex items-center space-x-1">
            <span class="text-slate-500 text-[10px]">時間:</span>
            <input type="time" value="${start}" class="req-start p-1 border rounded bg-white text-[11px]">
            <span>-</span>
            <input type="time" value="${end}" class="req-end p-1 border rounded bg-white text-[11px]">
          </div>
          <div class="flex items-center space-x-1">
            <span class="text-slate-500 text-[10px]">必要人数:</span>
            <input type="number" value="${count}" min="1" max="20" class="req-count w-12 p-1 border rounded bg-white text-[11px] text-center font-bold">
            <span class="text-slate-400 text-[10px]">名</span>
          </div>
        </div>
      `;
      container.appendChild(div);
    }

    function toggleReqDateInput(rowId) {
      const row = document.getElementById(rowId);
      const type = row.querySelector('.req-type').value;
      const dateInput = row.querySelector('.req-date');
      if (type === '平日共通') {
        dateInput.classList.add('hidden');
      } else {
        dateInput.classList.remove('hidden');
        if (!dateInput.value) {
          const ym = document.getElementById('target-month').value;
          dateInput.value = `${ym}-01`;
        }
      }
    }

    function saveRequirements() {
      const rows = document.querySelectorAll('.req-row');
      let requirements = [];
      let hasError = false;

      rows.forEach(r => {
        const type = r.querySelector('.req-type').value;
        const dateVal = r.querySelector('.req-date').value;
        if (type === '特定日' && !dateVal) {
          alert('日付指定が選択されている行で、日付が未入力です。カレンダーから日付を選択してください。');
          hasError = true;
          return;
        }

        requirements.push({
          date: type === '平日共通' ? '平日共通' : dateVal,
          startTime: r.querySelector('.req-start').value,
          endTime: r.querySelector('.req-end').value,
          count: r.querySelector('.req-count').value
        });
      });

      if (hasError) return;

      postToGas({ action: 'saveRequirements', userId: userId, requirements: requirements }).then(res => {
        if (res.success) alert('必要人員設定を保存しました。');
      });
    }

    function runAutoShiftGeneration() {
      const yearMonth = document.getElementById('target-month').value;
      if (!confirm(`${yearMonth} のシフトを自動作成しますか？\n（同月の確定シフトは上書きされます）`)) return;

      document.getElementById('loading').classList.remove('hidden');
      postToGas({ action: 'generateAutoShift', userId: userId, yearMonth: yearMonth }).then(res => {
        document.getElementById('loading').classList.add('hidden');
        if (res.success) {
          alert(`自動作成が完了しました（割当数: ${res.count}件）`);
          loadConfirmedShifts();

          const alertBox = document.getElementById('admin-shortage-alert-box');
          const alertList = document.getElementById('shortage-alert-list');
          alertList.innerHTML = '';

          if (res.alerts && res.alerts.length > 0) {
            alertBox.classList.remove('hidden');
            res.alerts.forEach(a => {
              const div = document.createElement('div');
              div.className = "bg-white p-2 rounded border border-amber-200 text-[11px] space-y-0.5";
              div.innerHTML = `
                <div class="flex justify-between font-bold text-amber-900">
                  <span>${a.date} (${a.slot})</span>
                  <span class="text-red-600">${a.shortage}名不足 (必要${a.required}名/割当${a.assigned}名)</span>
                </div>
                <div class="text-[10px] text-slate-500 font-mono">${a.reason}</div>
              `;
              alertList.appendChild(div);
            });
          } else {
            alertBox.classList.add('hidden');
          }
        } else {
          alert('エラー: ' + res.message);
        }
      });
    }

    function renderAdminDailyEdits() {
      const container = document.getElementById('admin-daily-shift-container');
      container.innerHTML = '';
      if (currentConfirmedShifts.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-400 py-4">確定シフトが存在しません。</p>';
        return;
      }

      const grouped = {};
      currentConfirmedShifts.forEach((s, idx) => {
        if (!grouped[s.date]) grouped[s.date] = [];
        grouped[s.date].push({ ...s, originalIndex: idx });
      });

      Object.keys(grouped).sort().forEach(date => {
        const shifts = grouped[date];
        const card = document.createElement('div');
        card.className = "p-2.5 bg-slate-50 border border-slate-200 rounded-xl space-y-2";
        
        let shiftRowsHtml = "";
        shifts.forEach(s => {
          shiftRowsHtml += `
            <div class="flex items-center justify-between bg-white p-1.5 rounded-lg border border-slate-200">
              <span class="font-bold text-slate-700 w-24 truncate">${s.staffName}</span>
              <div class="flex items-center space-x-1">
                <input type="time" id="edit-start-${s.originalIndex}" value="${s.startTime}" class="p-0.5 border rounded text-[10px]">
                <span>-</span>
                <input type="time" id="edit-end-${s.originalIndex}" value="${s.endTime}" class="p-0.5 border rounded text-[10px]">
                <button onclick="removeShiftRow(${s.originalIndex})" class="text-red-500 font-bold px-1.5 hover:bg-red-50 rounded">×</button>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="flex justify-between items-center font-bold text-slate-700 border-b border-slate-200 pb-1">
            <span>${date}</span>
            <span class="text-[11px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">${shifts.length}名 配置中</span>
          </div>
          <div class="space-y-1">${shiftRowsHtml}</div>
        `;
        container.appendChild(card);
      });
    }

    function removeShiftRow(index) {
      if (!confirm('このシフト割当を削除しますか？')) return;
      currentConfirmedShifts.splice(index, 1);
      renderAdminDailyEdits();
    }

    function saveAdminShiftEdits() {
      const yearMonth = document.getElementById('target-month').value;
      currentConfirmedShifts.forEach((s, idx) => {
        const startEl = document.getElementById(`edit-start-${idx}`);
        const endEl = document.getElementById(`edit-end-${idx}`);
        if (startEl && endEl) {
          s.startTime = startEl.value;
          s.endTime = endEl.value;
        }
      });
      document.getElementById('loading').classList.remove('hidden');
      postToGas({ action: 'saveConfirmedShifts', userId: userId, yearMonth: yearMonth, shifts: currentConfirmedShifts }).then(res => {
        document.getElementById('loading').classList.add('hidden');
        if (res.success) {
          alert('修正内容を保存しました！');
          loadConfirmedShifts();
        }
      });
    }

    function switchTab(tab) {
      document.getElementById('sec-sub').classList.add('hidden');
      document.getElementById('sec-view').classList.add('hidden');
      document.getElementById('sec-admin').classList.add('hidden');
      document.getElementById('btn-tab-sub').className = "flex-1 py-2 rounded-lg hover:text-green-600 transition-all";
      document.getElementById('btn-tab-view').className = "flex-1 py-2 rounded-lg hover:text-green-600 transition-all";
      document.getElementById('btn-tab-admin').className = "flex-1 py-2 rounded-lg text-red-600 hover:text-red-700 transition-all";

      if (tab === 'sub') {
        document.getElementById('sec-sub').classList.remove('hidden');
        document.getElementById('btn-tab-sub').className = "flex-1 py-2 rounded-lg bg-white text-slate-800 shadow-sm font-bold";
      } else if (tab === 'view') {
        document.getElementById('sec-view').classList.remove('hidden');
        document.getElementById('btn-tab-view').className = "flex-1 py-2 rounded-lg bg-white text-slate-800 shadow-sm font-bold";
      } else if (tab === 'admin') {
        document.getElementById('sec-admin').classList.remove('hidden');
        document.getElementById('btn-tab-admin').className = "flex-1 py-2 rounded-lg bg-red-600 text-white shadow-sm font-bold";
      }
    }
  </script>
</body>
</html>
